<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10141d">
  <title>Meshy AI — Mikhail Kalinin 3D Model</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #10141d; color: #f4f6fb; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100% - 32px, 1050px); margin: 0 auto; padding: 44px 0; }
    h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 4vw, 2.6rem); }
    p { color: #b7c0d2; margin: 0 0 22px; }
    model-viewer { width: 100%; height: min(68vh, 650px); min-height: 360px; background: radial-gradient(ellipse at center, #283245 0%, #171d29 65%, #121722 100%); border: 1px solid #303a4c; border-radius: 18px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
    a { display: inline-block; padding: 11px 16px; border-radius: 10px; color: #10141d; background: #a8d9ff; font-weight: 650; text-decoration: none; }
    a.secondary { color: #e7edf7; background: #252e3d; border: 1px solid #3b4659; }
    .hint { margin-top: 15px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Meshy AI — Mikhail Kalinin</h1>
    <p>Interactive 3D model preview. Drag to rotate, scroll to zoom.</p>
    <model-viewer
      src="./Meshy_AI_Mikhail_Kalinin_1025080243_generate.glb"
      alt="Meshy AI 3D model of Mikhail Kalinin"
      camera-controls
      auto-rotate
      shadow-intensity="1"
      exposure="1">
      <p slot="poster">Loading 3D model…</p>
    </model-viewer>
    <div class="actions">
      <a href="./Meshy_AI_Mikhail_Kalinin_1025080243_generate.glb" download>Download the GLB model</a>
      <a class="secondary" href="https://github.com/Priyanshi579" target="_blank" rel="noopener">GitHub profile</a>
    </div>
    <p class="hint">Model file: Meshy_AI_Mikhail_Kalinin_1025080243_generate.glb</p>
  </main>
</body>
</html>
